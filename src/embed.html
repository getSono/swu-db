<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SWU Netzkarte</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0b; color: #f4f4f5; }
  body { font-family: "Outfit", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  #map { height: 100vh; padding: 10px; box-sizing: border-box; }
  @media (max-width: 640px) { #map { padding: 0; } }
</style>
</head>
<body>
<div id="map"></div>
<script type="module">
  import { createNetworkMap } from "/network-map.js";
  const params = new URLSearchParams(location.search);
  const mode = params.get("mode");
  createNetworkMap({
    container: document.getElementById("map"),
    mode: mode === "tram" || mode === "bus" ? mode : "all",
    apiBase: params.get("api") || "",
    fill: true
  });
</script>
</body>
</html>
